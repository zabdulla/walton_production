name: Daily email (beta sample)

# Sends one sample of the beta daily email (src/daily_digest_beta.py): the
# regular message plus the dashboard's "Pounds by machine" bars drawn inside
# it from table cells. Run it from the Actions tab with a recipient and an
# optional production day. The regular daily email is untouched.
#
# Needs GMAIL_SEND_TOKEN_JSON (the same send token the daily digest uses).

on:
  workflow_dispatch:
    inputs:
      to:
        description: "Recipient(s), comma-separated"
        required: true
        type: string
      date:
        description: "Production day, YYYY-MM-DD (default: yesterday)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: digest-beta
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/New_York
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (locked)
        run: pip install -r requirements.lock

      # The committed daily record can be hours old (it is snapshotted once a day, sometimes
      # mid-shift); the poll log is current, so derive the day's rows from it first, the way
      # the 7 AM email does. The End of Shift sheet adds hours and crew when the secrets exist.
      - name: Pull End of Shift entries from the log sheet
        env:
          SHEETS_TOKEN_JSON: ${{ secrets.SHEETS_TOKEN_JSON }}
          WALTON_LABOR_SHEET_ID: ${{ secrets.WALTON_LABOR_SHEET_ID }}
        run: |
          if [ -z "$SHEETS_TOKEN_JSON" ] || [ -z "$WALTON_LABOR_SHEET_ID" ]; then
            echo "::warning::SHEETS_TOKEN_JSON / WALTON_LABOR_SHEET_ID not set — the sample carries the last known reports."
            exit 0
          fi
          mkdir -p ~/.config/walton
          printf '%s' "$SHEETS_TOKEN_JSON" > ~/.config/walton/sheets_token.json
          chmod 600 ~/.config/walton/sheets_token.json
          python3 src/labor_sheet.py

      - name: Rebuild the day's rows from the poll log
        run: python3 src/weekly_update.py --daily --no-commit

      - name: Build and send the sample
        env:
          GMAIL_SEND_TOKEN_JSON: ${{ secrets.GMAIL_SEND_TOKEN_JSON }}
          TO: ${{ inputs.to }}
          DAY: ${{ inputs.date }}
        run: |
          if [ -z "$GMAIL_SEND_TOKEN_JSON" ]; then
            echo "::error::GMAIL_SEND_TOKEN_JSON secret is not set"; exit 1
          fi
          echo "::add-mask::$TO"
          python3 src/daily_digest_beta.py --send --to "$TO" ${DAY:+--date "$DAY"}
