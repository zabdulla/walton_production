name: Weekly Cloud Fallback

# Remediation counterpart to heartbeat.yml (which only *detects* a missed
# Monday run). The primary weekly update runs on a Mac via launchd at noon
# ET. If that machine is asleep or broken, THIS workflow runs the same
# pipeline in Actions two hours later and publishes, so the dashboards
# never go stale because of a single machine.
#
# Details that make this work headless:
#   - Nothing is fetched by email any more: production comes from the
#     cieTrade poll log (committed) and the End of Shift log; the fresh
#     checkout's empty processing_reports/ folder is fine.
#   - The payroll dashboard is skipped automatically (PII roster is a
#     local-only file, never in the repo).
#   - Pushes made with GITHUB_TOKEN do not trigger `push` workflows, so
#     the final step dispatches deploy-pages.yml explicitly.

on:
  schedule:
    - cron: '0 18 * * 1'   # Mondays 18:00 UTC = 2pm EDT / 1pm EST
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if the local job already published today"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # to dispatch deploy-pages.yml after pushing

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if the local run already published today
        id: guard
        run: |
          last=$(git log -1 --format=%ct -- data/aggregated_daily_data.xlsx)
          age_h=$(( ( $(date +%s) - last ) / 3600 ))
          echo "Last data commit: ${age_h}h ago"
          if [ "${{ inputs.force }}" != "true" ] && [ "$age_h" -lt 20 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Local job already published — nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (locked)
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.lock

      - name: Configure git identity
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "walton-cloud-fallback[bot]"
          git config user.email "walton-cloud-fallback@users.noreply.github.com"

      - name: Pull End of Shift entries from the log sheet
        if: steps.guard.outputs.skip != 'true'
        # Never fatal, like the poll workflow: without the pull the rows keep the hours on file.
        continue-on-error: true
        env:
          SHEETS_TOKEN_JSON: ${{ secrets.SHEETS_TOKEN_JSON }}
          WALTON_LABOR_SHEET_ID: ${{ secrets.WALTON_LABOR_SHEET_ID }}
          MAIL_PROVIDER: ${{ vars.MAIL_PROVIDER || 'google' }}
          EOS_SOURCE: ${{ vars.EOS_SOURCE || 'google' }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          GRAPH_MAILBOX: ${{ secrets.GRAPH_MAILBOX }}
          EOS_WORKBOOK_URL: ${{ secrets.EOS_WORKBOOK_URL }}
          EOS_WORKBOOK_DRIVE_ID: ${{ secrets.EOS_WORKBOOK_DRIVE_ID }}
          EOS_WORKBOOK_ITEM_ID: ${{ secrets.EOS_WORKBOOK_ITEM_ID }}
        run: |
          if [ "$EOS_SOURCE" = "microsoft" ]; then
            if [ -z "$GRAPH_CLIENT_SECRET" ] || { [ -z "$EOS_WORKBOOK_URL" ] && { [ -z "$EOS_WORKBOOK_DRIVE_ID" ] || [ -z "$EOS_WORKBOOK_ITEM_ID" ]; }; }; then
              echo "::warning::EOS_SOURCE=microsoft but GRAPH_CLIENT_SECRET / EOS_WORKBOOK_URL (or EOS_WORKBOOK_DRIVE_ID + EOS_WORKBOOK_ITEM_ID) not set — rows keep the hours already on file."
              exit 0
            fi
            python3 src/labor_sheet.py
            exit 0
          fi
          if [ -z "$SHEETS_TOKEN_JSON" ] || [ -z "$WALTON_LABOR_SHEET_ID" ]; then
            echo "::warning::SHEETS_TOKEN_JSON / WALTON_LABOR_SHEET_ID not set — rows keep the hours already on file."
            exit 0
          fi
          mkdir -p ~/.config/walton
          printf '%s' "$SHEETS_TOKEN_JSON" > ~/.config/walton/sheets_token.json
          chmod 600 ~/.config/walton/sheets_token.json
          python3 src/labor_sheet.py

      - name: Run weekly update pipeline
        # The step above already pulled the End of Shift rows; without the Graph /
        # Sheets settings here the pipeline does not fetch them a second time.
        if: steps.guard.outputs.skip != 'true'
        env:
          WALTON_WEBHOOK_URL: ${{ secrets.WALTON_WEBHOOK_URL }}
        run: python3 src/weekly_update.py

      - name: Deploy Pages (GITHUB_TOKEN pushes don't auto-trigger it)
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY"
