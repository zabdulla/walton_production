name: Daily email (sample)

# Sends one copy of the daily email (src/daily_digest.py) for a chosen
# production day to a recipient typed at dispatch, without touching the
# once-a-day send or its state. Run it from the Actions tab to check a layout
# change or to re-send a day.
#
# Needs GMAIL_SEND_TOKEN_JSON (the same send token the daily digest uses).

on:
  workflow_dispatch:
    inputs:
      to:
        description: "Recipient(s), comma-separated"
        required: true
        type: string
      date:
        description: "Production day, YYYY-MM-DD (default: yesterday)"
        required: false
        type: string
      mail_provider:
        description: "Send through: google or microsoft (default: the repository variable MAIL_PROVIDER, else google)"
        required: false
        type: string
      eos_source:
        description: "End of Shift rows from: google or microsoft (default: the repository variable EOS_SOURCE, else google)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: digest-sample
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/New_York
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (locked)
        run: pip install -r requirements.lock

      # The committed daily record can be hours old (it is snapshotted once a day, sometimes
      # mid-shift); the poll log is current, so derive the day's rows from it first, the way
      # the 7 AM email does. The End of Shift sheet adds hours and crew when the secrets exist.
      - name: Pull End of Shift entries from the log sheet
        env:
          SHEETS_TOKEN_JSON: ${{ secrets.SHEETS_TOKEN_JSON }}
          WALTON_LABOR_SHEET_ID: ${{ secrets.WALTON_LABOR_SHEET_ID }}
          MAIL_PROVIDER: ${{ vars.MAIL_PROVIDER || 'google' }}
          EOS_SOURCE: ${{ inputs.eos_source || vars.EOS_SOURCE || 'google' }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          GRAPH_MAILBOX: ${{ secrets.GRAPH_MAILBOX }}
          EOS_WORKBOOK_URL: ${{ secrets.EOS_WORKBOOK_URL }}
          EOS_WORKBOOK_DRIVE_ID: ${{ secrets.EOS_WORKBOOK_DRIVE_ID }}
          EOS_WORKBOOK_ITEM_ID: ${{ secrets.EOS_WORKBOOK_ITEM_ID }}
        run: |
          if [ "$EOS_SOURCE" = "microsoft" ]; then
            if [ -z "$GRAPH_CLIENT_SECRET" ] || { [ -z "$EOS_WORKBOOK_URL" ] && [ -z "$EOS_WORKBOOK_ITEM_ID" ]; }; then
              echo "::warning::EOS_SOURCE=microsoft but GRAPH_CLIENT_SECRET / EOS_WORKBOOK_URL (or EOS_WORKBOOK_DRIVE_ID + EOS_WORKBOOK_ITEM_ID) not set — the sample carries the last known reports."
              exit 0
            fi
            python3 src/labor_sheet.py
            exit 0
          fi
          if [ -z "$SHEETS_TOKEN_JSON" ] || [ -z "$WALTON_LABOR_SHEET_ID" ]; then
            echo "::warning::SHEETS_TOKEN_JSON / WALTON_LABOR_SHEET_ID not set — the sample carries the last known reports."
            exit 0
          fi
          mkdir -p ~/.config/walton
          printf '%s' "$SHEETS_TOKEN_JSON" > ~/.config/walton/sheets_token.json
          chmod 600 ~/.config/walton/sheets_token.json
          python3 src/labor_sheet.py

      - name: Rebuild the day's rows from the poll log
        run: python3 src/weekly_update.py --daily --no-commit

      - name: Build and send the sample
        env:
          GMAIL_SEND_TOKEN_JSON: ${{ secrets.GMAIL_SEND_TOKEN_JSON }}
          TO: ${{ inputs.to }}
          DAY: ${{ inputs.date }}
          MAIL_PROVIDER: ${{ inputs.mail_provider || vars.MAIL_PROVIDER || 'google' }}
          EOS_SOURCE: ${{ vars.EOS_SOURCE || 'google' }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          GRAPH_MAILBOX: ${{ secrets.GRAPH_MAILBOX }}
          EOS_WORKBOOK_URL: ${{ secrets.EOS_WORKBOOK_URL }}
          EOS_WORKBOOK_DRIVE_ID: ${{ secrets.EOS_WORKBOOK_DRIVE_ID }}
          EOS_WORKBOOK_ITEM_ID: ${{ secrets.EOS_WORKBOOK_ITEM_ID }}
        run: |
          if [ "$MAIL_PROVIDER" = "microsoft" ]; then
            if [ -z "$GRAPH_CLIENT_SECRET" ]; then echo "::error::GRAPH_CLIENT_SECRET secret is not set"; exit 1; fi
          elif [ -z "$GMAIL_SEND_TOKEN_JSON" ]; then
            echo "::error::GMAIL_SEND_TOKEN_JSON secret is not set"; exit 1
          fi
          echo "::add-mask::$TO"
          python3 src/daily_digest.py --send --to "$TO" ${DAY:+--date "$DAY"}
