<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>End of Shift</title>
<!-- Short, readable address for the End of Shift web app (an Apps Script page).
     Share https://zabdulla.github.io/walton_production/shift or the QR code in
     qr.png; if the app is ever redeployed, change APP below and the link keeps working. -->
<meta http-equiv="refresh" content="0; url=https://script.google.com/a/macros/plusmaterials.com/s/AKfycbzioVxyyfdIfcv3JX_rAIkeZVPNpx3SMBzCv3YZbPMVLv4VxfkNtzFuogiBIypNULqgMQ/exec">
<style>
  :root { --bg:#f6f7f9; --text:#1a1d21; --muted:#5b6470; --accent:#1f6feb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --text:#e8ebef; --muted:#9aa4b0; --accent:#6ea8ff; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text);
         font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding:16px; box-sizing:border-box; }
  main { max-width:420px; text-align:center; }
  a.btn { display:inline-block; margin-top:12px; padding:14px 22px; border-radius:10px; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; }
  p { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>End of Shift</h1>
  <p>Opening the report form…</p>
  <a class="btn" id="go" href="https://script.google.com/a/macros/plusmaterials.com/s/AKfycbzioVxyyfdIfcv3JX_rAIkeZVPNpx3SMBzCv3YZbPMVLv4VxfkNtzFuogiBIypNULqgMQ/exec">Open the form</a>
</main>
<script>
  var APP = document.getElementById('go').href;
  window.location.replace(APP);
</script>
</body>
</html>
